<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="top-board">
            <div class="score-board">
                <button onclick="autoplay()" id="autoplay-btn" style="background-color: black; color: rgb(167, 167, 167); height: 1.7em; width: 5.5em;font-size: 1.5em;">autoplay</button>
                <button onclick="reset()" style="background-color: black; height: 1.7em; width: 2em; font-size: 1.5em;">🔁</button>
            </div>

            <div class="score-board">
                <div class="score-name">P</div>
                <div class="score" id="player-score">0</div>
            </div>

            <div class="score-board">
                <div class="score-name">C</div>
                <div class="score" id="computer-score">0</div>
            </div>
        </div>

        <div class="status">

            <div class="computer">
                <h2 id="cw">computer</h2>
            </div>

            <div class="game-over">
                <h1 id="msg">Choose your move</h1>
                <button id="rst-btn" onclick="restart()">restart</button>
            </div>

            <div class="player">
                <h2 id="pw">player</h2>
            </div>

        </div>
        <div class="moves">
            <button class="rock-btn">Rock</button>
            <button class="paper-btn">Paper</button>
            <button class="scissor-btn">Scissor</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
